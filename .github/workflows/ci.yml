name: IncidentX AI Enterprise CI/CD Pipeline

'on':
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Security & Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pytest pytest-asyncio

      - name: Run Bandit AST Security Scan
        run: |
          bandit -c .bandit.yaml -r backend/ -ll

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v --maxfail=1

  frontend-validation:
    name: Frontend TypeScript & Standalone Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Compile Standalone Production Build
        run: npm run build

  container-security-audit:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          load: true
          tags: incidentx-backend:latest

      - name: Run Trivy Security Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: incidentx-backend:latest
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
